name = "Batwing"
author = "XeTrinityz"
version = "1.5.1"
description = "Call in the Batwing and fly it around Gotham. Proper flight model with stalls and a VTOL hover, and it uses your Batmobile's weapons. Fly it by remote, have it escort you or have it carry the Batmobile. Y calls the Batwing, U remote control, I escort, T orders a strike, O lifts or fetches the Batmobile, F4 opens the settings deck. On a controller hold the left stick in and press A for the command wheel. Every key and button can be changed in the deck."
